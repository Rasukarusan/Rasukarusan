<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190">
  <style>
    .card { fill: #fffefe; stroke: #e4e2e2; }
    .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #2f80ed; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, sans-serif; fill: #434d58; }
    .value { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #434d58; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .label, .value { fill: #c9d1d9; }
      .title { fill: #58a6ff; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="399" height="189" rx="4.5"/>
  <text class="title" x="25" y="35">Rasukarusan's GitHub Stats</text>
  <text class="label" x="25" y="70">Total Stars:</text>
  <text class="value" x="375" y="70" text-anchor="end">447</text>
  <text class="label" x="25" y="96">Commits (last year):</text>
  <text class="value" x="375" y="96" text-anchor="end">5,305</text>
  <text class="label" x="25" y="122">Total PRs:</text>
  <text class="value" x="375" y="122" text-anchor="end">871</text>
  <text class="label" x="25" y="148">Total Issues:</text>
  <text class="value" x="375" y="148" text-anchor="end">238</text>
  <text class="label" x="25" y="174">Contributed to:</text>
  <text class="value" x="375" y="174" text-anchor="end">11</text>
</svg>
